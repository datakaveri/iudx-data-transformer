# =============================================================================
# IUDX Data Transformer – Configuration
# =============================================================================
# This file is mounted into the cron-job container.
# Do NOT commit credentials to source control; use a secrets manager or
# Docker Secrets / Kubernetes Secrets in production.
# =============================================================================

# ---- Elasticsearch ----------------------------------------------------------
elasticsearch:
  host: elasticsearch          # service name inside docker network (or IP/FQDN)
  port: 9200
  scheme: http                 # http | https
  username: elastic
  password: changeme

  # Optional: only process indices whose names start with this prefix.
  # Leave empty ("") to process all user-facing indices.
  # Example: "iudx-" will match iudx-weather, iudx-soil-report, etc.
  index_prefix: ""

  # Number of documents fetched per ES page (tune for memory vs. speed).
  # Lower values reduce peak memory; 500 is a safe default for large indices.
  batch_size: 500

  # Index that holds catalogue metadata documents (one doc per dataset UUID).
  # lastUpdated is written here after each successful Parquet upload.
  catalogue_index: catalogue

# ---- Object Store (S3 / MinIO) ----------------------------------------------
object_store:
  endpoint_url: http://minio:9000   # MinIO service name or S3 endpoint
  access_key: minioadmin
  secret_key: minioadmin
  bucket: parquet-files-bucket      # bucket is auto-created if it does not exist
  region: us-east-1                 # ignored by MinIO but required by boto3

# ---- Redis ------------------------------------------------------------------
redis:
  host: redis                  # service name inside docker network (or IP/FQDN)
  port: 6379
  cluster_mode: false          # set to true when connecting to a Redis Cluster
  username: ""                 # leave empty if ACL auth is not configured
  password: ""                 # leave empty for no-auth Redis

  # Prefix prepended to every Redis key (queue names) for namespace isolation.
  # Example: "iudx:" → keys become "iudx:jobs:report", "iudx:jobs:zip".
  # Leave empty ("") for no prefix.
  key_prefix: ""

  # Queue to which a readiness message is pushed after each Parquet upload.
  # The report worker consumes with BRPOP, so producers use LPUSH to preserve FIFO.
  readiness_queue_name: jobs:report

  # Queue to which a zip job is pushed after each Parquet upload.
  # The zip worker consumes with BRPOP, so producers use LPUSH to preserve FIFO.
  zip_queue_name: jobs:zip

# ---- Transformer Behaviour --------------------------------------------------
transformer:
  # How often the job runs (in minutes)
  schedule_minutes: 1

  # Persistent file that tracks the last-pushed document per index.
  # Mount a volume to this path so checkpoints survive container restarts.
  checkpoint_file: /data/checkpoints/state.json

  # Set to false to ignore any existing checkpoint file on startup and reprocess
  # all documents from the beginning. The file is always written going forward
  # regardless of this setting.
  resume_checkpoint: true
